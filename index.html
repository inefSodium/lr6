<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квадрат с кнопками</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        .square-container {
            margin: 10% 20% 0 20%; /* сверху 10%, слева и справа 20% */
            width: 60%; /* Оставшиеся 60% ширины */
            aspect-ratio: 1 / 1; /* Сохраняем пропорции квадрата */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .square {
            width: 100%;
            height: 100%;
            background-color: #4a6fa5;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        .buttons-container {
            margin-top: 10%; 
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }
        
        /* Стили для разных кнопок */
        .btn-1 { background-color: #4CAF50; }
        .btn-2 { background-color: #f44336; }
        .btn-3 { background-color: #000000; }
        .btn-4 { background-color: #2196F3; }
        

        @media (max-width: 768px) {
            .square-container {
                margin: 10% 10% 0 10%;
                width: 80%;
            }
            
            .buttons-container {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="square-container">
            <div class="square"></div>
        </div>
        
        <div class="buttons-container">
            <button class="btn-1">Зеленая</button>
            <button class="btn-2">Красная</button>
            <button class="btn-3">Случайный цвет</button>
            <button class="btn-4">Синяя</button>
        </div>
    </div>
    <script src="C:\Users\userb\Desktop\script.js"></script>
</body>
</html>
